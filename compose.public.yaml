# Own domain with ports 80/443: Caddy obtains the certificate for ODIN_DOMAIN from Let's Encrypt.
# docker compose -f compose.yaml -f compose.public.yaml up --build -d
# Use together with compose.yaml; same project and PostgreSQL volume.
x-public-env: &public-env
  ODIN_ORIGIN: https://${ODIN_DOMAIN:?Define ODIN_DOMAIN en .env}
  ODIN_SECURE_COOKIES: 'true'
services:
  api:
    environment: *public-env
    command: [uvicorn, 'odin.main:app', --host, 0.0.0.0, --port, '8000', --proxy-headers, --forwarded-allow-ips, '172.30.90.2', --no-access-log]
    networks:
      default: {}
      public_edge:
        ipv4_address: 172.30.90.3
  worker:
    environment: *public-env
  analyst:
    environment: *public-env
  telegram:
    environment: *public-env
  probe:
    environment: *public-env
  tracer:
    environment: *public-env
  web:
    environment:
      ODIN_DOMAIN: ${ODIN_DOMAIN}
    ports: !override
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile.public:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      public_edge:
        ipv4_address: 172.30.90.2
networks:
  public_edge:
    ipam:
      config:
        - subnet: 172.30.90.0/24
volumes:
  caddy_data:
  caddy_config:
